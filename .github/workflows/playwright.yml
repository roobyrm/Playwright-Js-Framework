name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      UI_BASE_URL: http://localhost:8000
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_DATABASE: wordpress
      TEST_USER: test-automation
      TEST_PASSWORD: Pass1234!
      TEST_EMAIL: test1234@live.com
      HEROKU_API_BASE_URL: https://restful-booker.herokuapp.com
      HEROKU_USERNAME: admin
      HEROKU_PASSWORD: password123

    steps:
      - uses: actions/checkout@v4

      # Set up Docker Compose
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          mkdir -p ~/.docker/cli-plugins/
          curl -SL https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose

      - name: Start Docker containers
        run: |
          docker compose up -d wordpress db
          docker ps
          # Wait for WordPress to be ready
          timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8000)" != "200" ]]; do sleep 5; done' || false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          npm install -D cross-env@7.0.3

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: |
          echo "Running all tests..."
          npx playwright test --reporter=html,line

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report/api/
            playwright-report/ui/
            test-results/
